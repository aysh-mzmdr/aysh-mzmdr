name: Update GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day at 00:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USERNAME: aysh-mzmdr
        run: node scripts/generate-github-stats.js

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add metrics/github-metrics.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub metrics [skip ci]"
          git push
